[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quickdraw-brevitas"
version = "0.1.0"
description = "QuickDraw training and quantization-aware training with Brevitas"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "QuickDraw-brevitas contributors" }
]
dependencies = [
  "numpy>=1.23",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.64",
  "matplotlib>=3.7",
  "torchlogix @ git+https://github.com/ligerlac/torchlogix@main",
  "pyverilator @ git+https://github.com/maltanar/pyverilator.git",
  "PyQt6>=6.11.0",
  "pyserial>=3.5"
]

[project.scripts]
quickdraw-train = "main:main"
quickdraw-logic-train = "main_logic:main"
quickdraw-logic-sweep = "sweep_logic_topology:main"
quickdraw-prepare-data = "DataUtils.prepare_data:main"

[tool.setuptools]
py-modules = ["main", "main_qat", "main_logic", "sweep_logic_topology", "convert_qdq_to_qop"]

[tool.setuptools.packages.find]
include = ["DataUtils*", "Model*"]

[tool.setuptools.package-data]
DataUtils = ["*.txt"]
